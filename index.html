  font-family: Arial, sans-serif;
  background: #0F0F0F;
  color: #F8F8F8;
  text-align: center;
  padding: 20px;
}

/* Title */
h1 {
  color: #5DD62C;
  margin-bottom: 20px;
  font-weight: 700;
}

/* Input */
input {
  padding: 14px;
  width: 85%;
  border-radius: 12px;
  border: 1px solid #337418;
  background: #202020;
  color: #F8F8F8;
  outline: none;
  font-size: 16px;
  transition: 0.2s;
}

input:focus {
  border: 1px solid #5DD62C;
  box-shadow: 0 0 10px rgba(93, 214, 44, 0.4);
}

/* Button */
button {
  padding: 14px;
  width: 50%;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  background: #5DD62C;
  color: #0F0F0F;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #337418;
  color: #F8F8F8;
}

/* Result box */
#result {
  margin-top: 25px;
}

/* Link */
a {
  display: inline-block;
  margin-top: 10px;
  color: #5DD62C;
  font-weight: bold;
  text-decoration: none;
}

a:hover {
  color: #F8F8F8;
}
  </style>
</head>

function searchLocation() {
  const input = document.getElementById("search").value.toLowerCase().trim();
  const result = document.getElementById("result");

  if (!input) {
    result.innerHTML = "Type something.";
    return;
  }

  const results = locations
    .map(loc => {
      let score = 0;

      loc.keywords.forEach(k => {
        if (input === k) score += 100;
        else if (input.includes(k)) score += 50;
        else if (k.includes(input)) score += 30;
      });

      return { loc, score };
    })
    .filter(r => r.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);

  if (results.length === 0) {
    result.innerHTML = "No matches found.";
    return;
  }

  result.innerHTML = results.map(r => `
    <div style="border:1px solid #ccc; padding:10px; margin:10px;">
      <h3>${r.loc.name}</h3>
      <p>${r.loc.description}</p>

      <a href="${r.loc.maps_link}" target="_blank">
        📍 Open in Google Maps
      </a>
    </div>
  `).join("");
}
